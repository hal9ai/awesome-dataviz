name: Site

# Builds awesomedataviz.com from README.md and deploys it to Cloudish.
# Pull requests get the build and tests (a check that README entries and
# demos/*/demo.json parse); main deploys on every change, once a day to
# refresh GitHub, npm, PyPI and CRAN data, and after the Demos workflow
# deploys a demo, so a merged demo shows up with its screenshot.

on:
  push:
    branches: [main]
    paths: ['README.md', 'site/**', '.github/workflows/site.yaml']
  pull_request:
    paths: ['README.md', 'site/**', 'demos/*/demo.json', 'demos/manifest.mjs', '.github/workflows/site.yaml']
  workflow_run:
    workflows: [Demos]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    # After a failed demo deploy, don't publish links to it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # README history powers the "listed since" dates
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-
      - name: Test
        run: npm test
      - name: Screenshot the live demos
        if: github.event_name != 'pull_request'
        run: npm run screenshots # new or changed demos, and any older than a week; never fails the build
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloudish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npm run deploy
        env:
          CLOUDISH_API_KEY: ${{ secrets.CLOUDISH_API_KEY }}
