name: Tests

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
    - name: Checks
      run: |
        gem install awesome_bot
        awesome_bot README.md --allow-redirect --allow 403,503 --white-list lattice.r-forge.r-project.org,datavizcatalogue.com,awesomedataviz.com,github.com/owner/repo
